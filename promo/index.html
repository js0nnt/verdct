<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Verdct — store assets</title>
    <style>
      /*
       * Every rule is scoped under .stage. The popup's Tailwind stylesheet is
       * imported by main.ts, so it lands in <head> after this block and its
       * preflight would otherwise reset the headings and repaint the body.
       */
      html { color-scheme: light; }
      html, body { margin: 0; padding: 0; }
      /* Canvas size is set per asset; the store wants several. */
      body {
        width: var(--w, 1280px);
        height: var(--h, 800px);
        overflow: hidden;
      }

      .stage {
        display: flex;
        flex-direction: column;
        width: var(--w, 1280px);
        height: var(--h, 800px);
        padding: 54px 64px;
        box-sizing: border-box;
        background: #f2f2f3;
        color: #1f1f1f;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .stage.dark { background: #171717; color: #ededed; }

      .stage .mark { display: flex; align-items: center; gap: 10px; }
      .stage .mark .glyph {
        width: 26px; height: 26px; border-radius: 7px;
        background: linear-gradient(135deg, #f4304a, #ff2e7e);
      }
      .stage .mark span { font-size: 16px; font-weight: 650; letter-spacing: -0.01em; }

      .stage h1 {
        margin: 22px 0 0; font-size: 40px; line-height: 1.12;
        letter-spacing: -0.025em; font-weight: 680; max-width: 22ch;
      }
      .stage h1 em { font-style: normal; color: #d81b4a; }
      .stage.dark h1 em { color: #ff5c7c; }
      .stage p.sub { margin: 13px 0 0; font-size: 16.5px; line-height: 1.45; color: #6b6b6b; max-width: 54ch; }
      .stage.dark p.sub { color: #a3a3a3; }

      .stage .content { flex: 1; display: flex; align-items: center; justify-content: center; gap: 40px; margin-top: 26px; min-height: 0; }

      .stage .window {
        border-radius: 12px; background: #fff; overflow: hidden;
        border: 1px solid #e2e2e2;
        box-shadow: 0 24px 60px rgba(15, 15, 15, 0.18), 0 2px 8px rgba(15, 15, 15, 0.08);
      }
      .stage .window .chrome {
        display: flex; align-items: center; gap: 7px;
        padding: 11px 14px; background: #f1f1f1; border-bottom: 1px solid #e2e2e2;
      }
      .stage .dot { width: 10px; height: 10px; border-radius: 999px; }
      .stage .chrome .url {
        margin-left: 10px; padding: 4px 12px; border-radius: 999px;
        background: #e6e6e6; color: #6b6b6b; font-size: 11.5px;
      }

      .stage table { border-collapse: collapse; width: 100%; font-size: 13px; color: #1f1f1f; }
      .stage thead th {
        text-align: left; padding: 10px 14px; font-size: 11px; font-weight: 700;
        color: #5a5a5a; border-bottom: 1px solid #e2e2e2; background: #fafafa;
      }
      .stage td { padding: 11px 14px; border-bottom: 1px solid #efefef; vertical-align: middle; white-space: nowrap; }
      .stage .instructor a { color: #8c1d40; text-decoration: underline; }
      .stage .muted { color: #767676; }

      .stage .popup-frame {
        border-radius: 14px; overflow: hidden; flex: none;
        /* Bounded by the row it sits in, not by a fixed number. At 500px it
           was taller than the space the copy left it, and being centred it
           overflowed both ways at once — printing the frame over the subhead
           above it and the footnote below. */
        max-height: 100%;
        border: 1px solid #e2e2e2;
        box-shadow: 0 24px 60px rgba(15, 15, 15, 0.22), 0 2px 8px rgba(15, 15, 15, 0.1);
      }
      .stage.dark .popup-frame { border-color: #333; }

      .stage .footnote {
        margin-top: auto; padding-top: 14px;
        font-size: 11.5px; color: #9a9a9a;
      }
      .stage.dark .footnote { color: #6f6f6f; }

      /* Promo tiles: branded rather than screenshots, and fully opaque since
         the store rejects an alpha channel on these. */
      .tile {
        display: flex;
        width: var(--w);
        height: var(--h);
        box-sizing: border-box;
        background: #14141a;
        color: #fff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        overflow: hidden;
        position: relative;
      }
      .tile::after {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(120% 90% at 100% 0%, rgba(244, 48, 74, 0.28), transparent 60%);
      }
      .tile > * { position: relative; z-index: 1; }

      .tile .mark { display: flex; align-items: center; gap: 10px; }
      .tile .mark .glyph { border-radius: 8px; background: linear-gradient(135deg, #f4304a, #ff2e7e); }
      .tile .mark span { font-weight: 680; letter-spacing: -0.01em; }
      .tile h2 { margin: 0; font-weight: 700; letter-spacing: -0.03em; line-height: 1.08; }
      .tile p { margin: 0; color: #b6b6c2; line-height: 1.4; }

      .tile .chips { display: flex; gap: 8px; flex-wrap: wrap; }
      .tile .chip {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 5px 11px; border-radius: 8px;
        background: #ffffff; color: #1f1f1f;
        font-size: 15px; font-weight: 700;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28);
      }
      .tile .chip i { width: 7px; height: 7px; border-radius: 999px; font-style: normal; }
      .tile .chip .nm { font-weight: 600; color: #4a4a4a; font-size: 13.5px; }

      .stage .callouts { display: flex; gap: 30px; margin-top: 22px; }
      .stage .callout { display: flex; align-items: flex-start; gap: 9px; max-width: 32ch; }
      .stage .callout .tick { color: #1f9d63; font-weight: 800; font-size: 14px; line-height: 1.5; }
      .stage .callout b { display: block; font-size: 14px; font-weight: 650; }
      .stage .callout span { font-size: 13px; color: #6b6b6b; line-height: 1.45; }
      .stage.dark .callout span { color: #a3a3a3; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
